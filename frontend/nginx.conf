server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA: cualquier ruta que no sea un archivo cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Las peticiones a /api/ deben ser ruteadas por el ALB a la tarea backend.
    # En ECS/ALB no existe el hostname "backend" por defecto, así que
    # dejamos que el ALB haga el enrutamiento. No proxy_pass local aquí.

    # Activos estáticos con cache larga
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
